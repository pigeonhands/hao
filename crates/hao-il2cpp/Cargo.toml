[package]
name = "hao-il2cpp"
authors = ["Sam M."]
version = "0.0.3"
edition = "2021"
description = "Read Unity Il2Cpp metadata and generate .net proxy assemblies with hao"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
documentation = "https://docs.rs/hao-il2cpp"
readme = "README.md"
keywords = ["unity", "il2cpp", "dotnet", "modding"]

[dependencies]
hao = { version = "0.0.8", path = "../hao" }
pewter = "0.0.10"
thiserror = "2"
facet = { version = "0.50.0-rc.7", optional = true }

[features]
reflect = ["dep:facet", "hao/reflect"]

[package.metadata.docs.rs]
all-features = true
