[package]
name = "hao"
authors = ["Sam M."]
categories = ["parsing"]
keywords = ["dotnet", "managed", "csharp", "netcore",  "dnlib"]

version = "0.0.4"
edition = "2021"
description = "Read, edit, create and write .net assemblies"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
documentation = "https://docs.rs/hao"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2"
pewter = "0.0.8"
strum = { version = "0.28", features = ["derive"] }
bitflags = "2.13"
uuid = "1.29"

# Browser wasm has no source of randomness, so new module ids are derived from their name there.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
uuid = { version = "1.29", features = ["v4"] }

[features]
default = []
sync = []
