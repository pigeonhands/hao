[package]
name = "hao"
authors = ["Sam M."]
categories = ["parsing"]
keywords = ["dotnet", "managed", "csharp", "netcore",  "dnlib"]

version = "0.0.3"
edition = "2021"
description = ".net binary reader"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
documentation = "https://docs.rs/hao"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0.35"
pewter = "0.0.5"
strum = { version = "0.26", features = ["derive"] }
bitflags = "2.2.1"
uuid = { version = "1.3.1", features = ["v4"] }

[features]
default = []
sync = []
