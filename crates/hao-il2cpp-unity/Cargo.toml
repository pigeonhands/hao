[package]
name = "hao-il2cpp-unity"
authors = ["Sam M."]
version = "0.0.3"
edition = "2021"
description = "Typed Unity wrappers for mods of Unity Il2Cpp games"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
readme = "README.md"
keywords = ["unity", "il2cpp", "modding", "hooking"]

[dependencies]
hao-il2cpp-runtime = { version = "0.0.3", path = "../hao-il2cpp-runtime" }
tracing = "0.1"
egui = { version = "0.29", optional = true }
facet = { version = "0.50.0-rc.7", optional = true }

[features]
egui = ["dep:egui"]
reflect = ["dep:facet", "hao-il2cpp-runtime/reflect"]

[dev-dependencies]
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "heal_mod"
crate-type = ["cdylib"]

[[example]]
name = "scene_overlay"
crate-type = ["cdylib"]

[[example]]
name = "render_overlay"
crate-type = ["cdylib"]

[[example]]
name = "egui_demo"
crate-type = ["cdylib"]
required-features = ["egui"]
