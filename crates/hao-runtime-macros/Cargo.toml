[package]
name = "hao-runtime-macros"
authors = ["Sam M."]
version = "0.0.3"
edition = "2021"
description = "Generate rust bindings to .net assemblies for hao-runtime"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
hao = { version = "0.0.7", path = "../hao" }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
hao-runtime = { path = "../hao-runtime" }
