[package]
name = "hao-godot"
version = "0.0.1"
edition = "2021"
description = "Attach to a Godot (CoreCLR / .NET) game's runtime for native mods"
license = "MIT"

[dependencies]
hao-runtime = { version = "0.0.1", path = "../hao-runtime" }
hooking = "0.6"
libc = "0.2"

[dev-dependencies]
hao-runtime-macros = { version = "0.0.1", path = "../hao-runtime-macros" }

[[example]]
name = "capture"
crate-type = ["cdylib"]

[[example]]
name = "call"
crate-type = ["cdylib"]
