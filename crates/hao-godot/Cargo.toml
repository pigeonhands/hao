[package]
name = "hao-godot"
version = "0.0.4"
edition = "2021"
description = "Attach to a Godot (CoreCLR / .NET) game's runtime for native mods"
documentation = "https://docs.rs/hao-godot"
license = "MIT"

[dependencies]
hao-runtime = { version = "0.0.4", path = "../hao-runtime" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hao-runtime-macros = { version = "0.0.4", path = "../hao-runtime-macros" }

[[example]]
name = "capture"
crate-type = ["cdylib"]

[[example]]
name = "call"
crate-type = ["cdylib"]

[[example]]
name = "profiler"
crate-type = ["cdylib"]

[[example]]
name = "godot_types"
crate-type = ["cdylib"]

[[example]]
name = "rewrite"
crate-type = ["cdylib"]

[features]
reflect = ["hao-runtime/reflect"]

[package.metadata.docs.rs]
all-features = true
