[package]
name = "hao-il2cpp-runtime"
authors = ["Sam M."]
version = "0.0.1"
edition = "2021"
description = "Hook and call into Unity Il2Cpp games from inside the game process"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
readme = "README.md"
keywords = ["unity", "il2cpp", "modding", "hooking"]

[dependencies]
hooking = "0.5"
libloading = "0.8"
thiserror = "1.0.35"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "heal_mod"
crate-type = ["cdylib"]

[dev-dependencies]
ctor = "0.2"
libc = "0.2"
