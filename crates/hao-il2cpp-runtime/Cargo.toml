[package]
name = "hao-il2cpp-runtime"
authors = ["Sam M."]
version = "0.0.4"
edition = "2021"
description = "Hook and call into Unity Il2Cpp games from inside the game process"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
documentation = "https://docs.rs/hao-il2cpp-runtime"
readme = "README.md"
keywords = ["unity", "il2cpp", "modding", "hooking"]

[dependencies]
hooking = "0.6"
libloading = "0.9"
thiserror = "2"
facet = { version = "0.50.0-rc.7", optional = true }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
reflect = ["dep:facet"]

[package.metadata.docs.rs]
all-features = true
