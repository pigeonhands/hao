[package]
name = "hao-runtime"
authors = ["Sam M."]
version = "0.0.1"
edition = "2021"
description = "Host the .net runtime (CoreCLR or Mono) in a rust process"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
readme = "README.md"
keywords = ["dotnet", "coreclr", "mono", "hosting", "interop"]

[dependencies]
libloading = "0.9"
thiserror = "2"
hao = { version = "0.0.4", path = "../hao", optional = true }

[dev-dependencies]
libloading = "0.9"
hao = { path = "../hao" }

[[example]]
name = "mono"
required-features = ["mono"]

[features]
default = ["coreclr"]
coreclr = ["hao"]
# `Runtime::load_module` for modules built or edited with hao.
hao = ["dep:hao"]
mono = []
