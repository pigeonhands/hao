[package]
name = "hao-runtime"
authors = ["Sam M."]
version = "0.0.1"
edition = "2021"
description = "Host the .net runtime (CoreCLR or Mono) in a rust process"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
readme = "README.md"
keywords = ["dotnet", "coreclr", "mono", "hosting", "interop"]

[dependencies]
libloading = "0.9"
thiserror = "2"
hao = { version = "0.0.5", path = "../hao", optional = true }

# For `attach`: hooking `coreclr_initialize` to capture a running host. The
# `hooking` crate's inline hook is x86_64-only, and this path is Linux-specific.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
hooking = "0.6"
libc = "0.2"

[dev-dependencies]
libloading = "0.9"
hao = { path = "../hao" }

[[example]]
name = "mono"
required-features = ["mono"]

[[example]]
name = "mono_attach"
required-features = ["mono"]

[features]
default = ["coreclr"]
coreclr = ["hao"]
# `Runtime::load_module` for modules built or edited with hao.
hao = ["dep:hao"]
mono = []
