[package]
name = "hao-runtime"
authors = ["Sam M."]
version = "0.0.3"
edition = "2021"
description = "Host the .net runtime (CoreCLR or Mono) in a rust process"
license = "MIT"
repository = "https://github.com/pigeonhands/hao"
readme = "README.md"
keywords = ["dotnet", "coreclr", "mono", "hosting", "interop"]

[dependencies]
libloading = "0.9"
thiserror = "2"
facet = { version = "0.50.0-rc.7", optional = true }
tracing = "0.1"
hao = { version = "0.0.7", path = "../hao", optional = true }

# `attach` captures a running host by inline-hooking the loader; the hooking
# crate's trampoline is x86_64-only (Linux and Windows).
[target.'cfg(target_arch = "x86_64")'.dependencies]
hooking = "0.6"

# `alloc_console` gives a windowed game (no console) somewhere for logs to go.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
libloading = "0.9"
hao = { path = "../hao" }

[[example]]
name = "mono"
required-features = ["mono"]

[[example]]
name = "mono_attach"
required-features = ["mono"]

[features]
default = ["coreclr"]
coreclr = ["hao"]
# `Runtime::load_module` for modules built or edited with hao.
hao = ["dep:hao"]
mono = []
reflect = ["dep:facet", "hao?/reflect"]
